    :root {
      --bg-1: #f3fbff;
      --bg-2: #d9f3ff;
      --ink: #082437;
      --ink-soft: #315062;
      --line: rgba(10, 46, 69, 0.14);
      --card: rgba(255, 255, 255, 0.68);
      --accent: #007f8a;
      --accent-2: #ff7f32;
      --shadow: 0 22px 50px rgba(5, 38, 60, 0.18);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 15% 20%, #ffffff 0%, var(--bg-1) 34%, var(--bg-2) 100%);
      scroll-behavior: smooth;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -3;
    }

    .bg-grid {
      opacity: 0.4;
      background-image:
        linear-gradient(to right, rgba(7, 72, 95, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(7, 72, 95, 0.06) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at 50% 40%, black 45%, transparent 90%);
    }

    .bg-gradient {
      z-index: -4;
      background:
        radial-gradient(circle at 84% 24%, rgba(255, 127, 50, 0.28), transparent 44%),
        radial-gradient(circle at 6% 84%, rgba(0, 127, 138, 0.30), transparent 48%);
      filter: blur(10px);
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(0.5px);
      pointer-events: none;
      z-index: -2;
      mix-blend-mode: multiply;
      animation: drift 18s ease-in-out infinite;
    }

    .orb-a {
      width: 210px;
      height: 210px;
      top: 12%;
      left: 78%;
      background: rgba(255, 127, 50, 0.2);
    }

    .orb-b {
      width: 280px;
      height: 280px;
      top: 58%;
      left: -60px;
      background: rgba(0, 127, 138, 0.24);
      animation-delay: -7s;
    }

    .orb-c {
      width: 160px;
      height: 160px;
      top: 72%;
      right: 8%;
      background: rgba(7, 114, 148, 0.14);
      animation-delay: -3.2s;
    }

    @keyframes drift {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-18px) scale(1.07);
      }
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px 18px 48px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      padding: 12px 16px;
      margin-bottom: 26px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 8px 30px rgba(10, 35, 62, 0.08);
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.97rem;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.88rem;
      color: var(--ink-soft);
    }

    .nav a {
      position: relative;
      padding-bottom: 2px;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.25s ease;
    }

    .nav a:hover::after {
      width: 100%;
    }

    .lang-switch {
      display: inline-flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      white-space: nowrap;
    }

    .lang-btn {
      border: 0;
      background: transparent;
      padding: 6px 11px;
      border-radius: 999px;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      color: var(--ink-soft);
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: linear-gradient(120deg, rgba(0, 127, 138, 0.95), rgba(8, 70, 106, 0.95));
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 103, 122, 0.32);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      padding: 28px;
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid var(--line);
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.6));
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .hero .kicker {
      margin: 0;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 10px 0 4px;
      font-size: clamp(2.2rem, 4vw, 3.3rem);
      line-height: 0.98;
      letter-spacing: 0.02em;
    }

    .hero .title {
      margin: 0;
      font-size: 1.04rem;
      color: var(--ink-soft);
      font-weight: 500;
    }

    .hero .summary {
      margin: 18px 0 0;
      color: #113950;
      line-height: 1.72;
      max-width: 64ch;
    }

    .hero-actions {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(110deg, var(--accent), #0c5f7d);
      box-shadow: 0 12px 24px rgba(0, 94, 116, 0.3);
    }

    .btn-secondary {
      border-color: rgba(7, 72, 95, 0.2);
      background: rgba(255, 255, 255, 0.74);
      color: var(--ink);
    }

    .chips {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid rgba(5, 61, 83, 0.2);
      background: rgba(255, 255, 255, 0.66);
      border-radius: 999px;
      font-size: 0.78rem;
      color: #15465f;
      padding: 6px 10px;
      font-weight: 500;
    }

    .focus-card {
      height: 100%;
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(14, 87, 112, 0.96), rgba(9, 64, 83, 0.96));
      color: #ebfbff;
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 20px 36px rgba(7, 48, 65, 0.34);
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .focus-card::before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      right: -90px;
      top: -90px;
      background: radial-gradient(circle, rgba(255, 127, 50, 0.58), transparent 65%);
      pointer-events: none;
    }

    .focus-card h3 {
      margin: 0;
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.86;
    }

    .focus-list {
      margin: 14px 0 0;
      padding-left: 18px;
      line-height: 1.7;
      font-size: 0.94rem;
    }

    .section {
      margin-top: 26px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(9, 48, 69, 0.1);
      padding: 24px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-tag {

      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--accent);

    .section-intro {

    .glass-card {

    .grid {

      gap: 12px;
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      border-radius: 14px;
      border: 1px solid rgba(8, 55, 78, 0.15);
      background: rgba(255, 255, 255, 0.74);
      padding: 16px;
      display: flex;

      font-size: 1rem;
      line-height: 1.4;
    }

    .card p {

      color: #1b475e;
      line-height: 1.64;
      font-size: 0.93rem;
    }

    .paper-link {

      gap: 5px;
      color: #0a5876;
      font-weight: 600;

      color: #fff;

      text-align: center;
      color: #3f6275;
      font-size: 0.84rem;

    .reveal {

      transform: translateY(18px);
      transition: opacity 0.6s ease, transform 0.6s ease;

    .reveal.visible {
      opacity: 1;
      transform: none;

    @media (max-width: 980px) {

        justify-content: center;

      .grid-3,

</head>

              link: "https://ojs.aaai.org/index.php/AAAI/article/view/38328/42290"

              title: "Vulnerabilities of Label and Model Protection in Vertical Federated Learning Based on Simulation Models",
              desc: "Contributed to VFLLIMA framework and investigated label leakage and model manipulation risks in VFL.",
              linkText: "DOI Link",
              link: "https://doi.org/10.1016/j.neucom.2025.131839"
            }
          ]
        },
        projects: {
          tag: "Projects",
          title: "Selected Projects",
          intro: "Representative projects in security research, agent systems, and practical engineering.",
          list: [
            {
              meta: "Sep 2025 - Present",
              title: "Student Innovation Funding Program (Phase III)",
              desc: "Applicant in a national program guided by CAC, collaborating with Ant Group on FL security and robust aggregation."
            },
            {
              meta: "Oct 2025 - Jan 2026",
              title: "Multi-Agent Anti-fraud Dialogue Dataset Generation System",
              desc: "Early-stage lead, built a closed-loop generation pipeline and implemented bilingual dataset workflows."
            },
            {
              meta: "Jul 2025 - Sep 2025",
              title: "AI Teaching Assistant for Network Security Analysis Practice",
              desc: "Project lead for Agent workflow and retrieval pipeline to support continuous QA and lab guidance."

            {
              meta: "Jan 2026 - Feb 2026",
              title: "End-to-end Encrypted Network Storage System",
              desc: "Team member, designed and implemented authentication, key management, encrypted transfer, and secure storage."
            }
          ]
        },
        contact: {
          title: "Contact",
          intro: "If you are interested in research collaboration, competitions, or technical projects, feel free to reach out by email.",
          mail: "Email: yili@bupt.edu.cn",
          github: "GitHub: yyylllup"
        },
        footer: "© 2026 Yi Li · Built for GitHub Pages"
      }
    };

    const setText = (id, value) => {
      const node = document.getElementById(id);
      if (node) node.textContent = value;
    };

    const renderCardList = (containerId, list, withLink = false) => {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = list.map((item) => {
        const linkBlock = withLink
          ? `<a class="paper-link" href="${item.link}" target="_blank" rel="noopener noreferrer">${item.linkText}</a>`
          : "";
        return `
          <article class="card">
            <p class="meta">${item.meta}</p>
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
            ${linkBlock}
          </article>
        `;
      }).join("");
    };

    const render = (lang) => {
      const t = content[lang] || content.zh;
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";

      setText("nav-about", t.nav.about);
      setText("nav-papers", t.nav.papers);
      setText("nav-projects", t.nav.projects);
      setText("nav-contact", t.nav.contact);

      setText("hero-kicker", t.hero.kicker);
      setText("hero-name", t.hero.name);
      setText("hero-title", t.hero.title);
      setText("hero-summary", t.hero.summary);
      setText("cta-github", t.hero.ctaGithub);
      setText("cta-mail", t.hero.ctaMail);
      setText("chip-1", t.hero.chips[0]);
      setText("focus-title", t.hero.focusTitle);

      const focusList = document.getElementById("focus-list");
      focusList.innerHTML = t.hero.focusList.map((item) => `<li>${item}</li>`).join("");

      setText("about-tag", t.about.tag);
      setText("about-title", t.about.title);
      setText("about-intro", t.about.intro);
      setText("edu-title", t.about.eduTitle);
      setText("edu-main", t.about.eduMain);
      setText("edu-time", t.about.eduTime);
      setText("skill-title", t.about.skillTitle);
      setText("skill-main", t.about.skillMain);
      setText("skill-sub", t.about.skillSub);

      setText("papers-tag", t.papers.tag);
      setText("papers-title", t.papers.title);
      setText("papers-intro", t.papers.intro);
      renderCardList("papers-grid", t.papers.list, true);

      setText("projects-tag", t.projects.tag);
      setText("projects-title", t.projects.title);
      setText("projects-intro", t.projects.intro);
      renderCardList("projects-grid", t.projects.list, false);

      setText("contact-title", t.contact.title);
      setText("contact-intro", t.contact.intro);
      setText("contact-mail", t.contact.mail);
      setText("contact-github", t.contact.github);
      setText("footer-text", t.footer);

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.langBtn === lang);
      });

      localStorage.setItem("site_lang", lang);
    };

    const bindLanguageSwitch = () => {
      const buttons = document.querySelectorAll(".lang-btn");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          render(btn.dataset.langBtn);
        });
      });
    };

    const bindReveal = () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll(".reveal").forEach((node) => observer.observe(node));
    };

    bindLanguageSwitch();
    bindReveal();
    const saved = localStorage.getItem("site_lang");
    const detected = navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
    render(saved || detected);
  </script>
</body>
</html>
